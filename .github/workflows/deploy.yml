name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build static site
        run: npm run build
        env:
          # Set as repository variables (Settings → Secrets and variables → Actions → Variables).
          # On winfintechnologies.com: SITE_URL=https://winfintechnologies.com, BASE_PATH unset, ALLOW_INDEXING=true.
          # On github.io:            SITE_URL=https://kaushik-i-b.github.io/winfin-website, BASE_PATH=/winfin-website, ALLOW_INDEXING=false.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://winfintechnologies.com' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'true' }}
          # Optional: set a repository variable CONTACT_ENDPOINT (e.g. a Formspree URL)
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
